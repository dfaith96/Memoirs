<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Live journey map</title>
  <desc id="desc">A care journey map showing intake, plan, engage, and follow up stages.</desc>
  <rect width="720" height="620" rx="28" fill="#ffffff"/>
  <rect x="34" y="34" width="652" height="552" rx="22" fill="#f4f9fb" stroke="#d5e5ea" stroke-width="2"/>
  <circle cx="72" cy="78" r="9" fill="#7fd1b9"/>
  <text x="96" y="86" fill="#0b4f6c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Live journey map</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0c3744" flood-opacity=".12"/>
    </filter>
  </defs>

  <path d="M360 146v326" stroke="#b8d4dd" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 14"/>

  <g filter="url(#shadow)">
    <rect x="76" y="126" width="568" height="90" rx="18" fill="#e7f4f5" stroke="#c7dde4"/>
    <circle cx="122" cy="171" r="24" fill="#0b4f6c"/>
    <text x="122" y="179" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900">1</text>
    <text x="166" y="164" fill="#10212b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Intake</text>
    <text x="166" y="191" fill="#5d7180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Patient details captured before the visit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="244" width="568" height="90" rx="18" fill="#ffffff" stroke="#d5e5ea"/>
    <circle cx="122" cy="289" r="24" fill="#0b6b78"/>
    <text x="122" y="297" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900">2</text>
    <text x="166" y="282" fill="#10212b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Plan</text>
    <text x="166" y="309" fill="#5d7180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Tasks assigned to the right care-team owner</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="362" width="568" height="90" rx="18" fill="#e7f4f5" stroke="#c7dde4"/>
    <circle cx="122" cy="407" r="24" fill="#7fd1b9"/>
    <text x="122" y="415" text-anchor="middle" fill="#0b4f6c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="900">3</text>
    <text x="166" y="400" fill="#10212b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Engage</text>
    <text x="166" y="427" fill="#5d7180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Automated nudges keep patients on track</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="480" width="568" height="74" rx="18" fill="#0b4f6c"/>
    <circle cx="122" cy="517" r="22" fill="#f0b84f"/>
    <text x="122" y="525" text-anchor="middle" fill="#0b4f6c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="900">4</text>
    <text x="166" y="525" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Follow up</text>
  </g>
</svg>
